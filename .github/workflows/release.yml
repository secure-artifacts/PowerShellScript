name: Release

# 推送 v* 形式的 tag 时触发：构建 exe、生成 Attestation 构建溯源、创建 Release
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write      # OIDC token，用于 Attestation 签名
  contents: write      # 创建 Release
  attestations: write  # 生成并存储 Attestation 记录

jobs:
  build:
    runs-on: windows-latest   # 需要 csc.exe / .NET Framework，只能在 Windows 上构建
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build exe
        shell: pwsh
        run: ./disable-browser-update/Build-Exe.ps1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: disable-browser-update/禁用浏览器更新.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: disable-browser-update/禁用浏览器更新.exe
          generate_release_notes: true
